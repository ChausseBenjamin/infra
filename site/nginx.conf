map $uri $cache_control {
    default "public, max-age=300, must-revalidate";
    ~*\.(?:jpe?g|png|gif|webp|avif|ico|svg|woff2?|ttf|otf|eot|css|js|mjs|pdf|wasm)$
             "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Traefik terminates TLS; keep redirects relative so they stay on https.
    absolute_redirect off;

    brotli on;
    # Emit `Vary: Accept-Encoding` for brotli responses. This flag only controls
    # the header; gzip itself stays off.
    gzip_vary on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml application/manifest+json
        application/wasm image/svg+xml image/x-icon
        font/ttf font/otf application/vnd.ms-fontobject;

    # Headers: defined once, inherited by every location
    add_header Cache-Control $cache_control;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
